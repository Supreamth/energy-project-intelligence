services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: intelligence
    volumes:
      - epi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: epi_minio
      MINIO_ROOT_PASSWORD: epi_minio_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - epi_minio:/data

volumes:
  epi_pg:
  epi_minio:
